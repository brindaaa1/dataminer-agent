# Hotel Booking Demand 数据字典（know-how 标注版，跨场景验证用）
# 数据源：Kaggle "Hotel booking demand"（hotel_bookings.csv），两家葡萄牙酒店 2015-07 至 2017-08 到店的预订。
# 字段名以实际下载的表头为准，加载时逐一校验。
#
# 本数据集的作用：证明同一套代码只需替换 know-how 就能迁移到非风控场景。
# 风控中的"贷后泄漏"在这里对应"事后泄漏"；可得时间的概念保持不变，只是时间点换成了"预订时刻"。
#
# availability 取值（本场景）：
#   at_prediction         预订时刻已知
#   history            预订时刻已知的客户历史
#   updated_until_event 从预订到入住/取消期间会被更新 → 按 unknown 处理
#   before_outcome         入住时才确定 → 泄漏
#   post_outcome       结果发生后才有 → 泄漏
#   meta               非特征
#   unknown            可得时间不明 → LEAK_SUSPECT

dataset: hotel_bookings
entity_key: row_index             # 数据集没有预订 ID，加载时生成行号
label:
  col: is_canceled
  definition: "预订最终被取消（通常包含 No-Show），加载时用 reservation_status 校验该对应关系，校验后 reservation_status 立即剔除"
  positive: 1
  negative: 0

observation_time:
  definition: "预订时刻 = 到店日期 − lead_time 天"
  arrival_date: "由 arrival_date_year + arrival_date_month（英文月份名）+ arrival_date_day_of_month 组合"
  booking_date: "arrival_date - lead_time"

suggested_split:
  split_on: arrival_date
  rationale: >
    不按预订日期切分：数据只包含 2017-08 之前到店的订单，越晚的预订日期中只剩短提前期的订单，
    会产生截断偏差。按到店日期切分则每个样本的结果都已完整。
  train_valid: ["2015-07", "2016-12"]     # valid 从中按 20% 随机切出
  oot_dev: ["2017-01", "2017-04"]
  holdout: ["2017-05", "2017-08"]
  caveat: >
    酒店业务季节性很强：oot_dev 覆盖冬春，holdout 覆盖夏季。OOT 上的漂移有一部分来自季节而非模型退化，
    报告中需要按月份对比同期（2016 年同月）的坏样本率，区分季节效应与真实漂移。

fields:
  hotel:                    {availability: at_prediction, type: categorical, values: [Resort Hotel, City Hotel]}
  lead_time:                {availability: at_prediction, type: numeric}
  arrival_date_year:        {availability: at_prediction, type: numeric, note: "用于切分；作为特征时会造成时间外推问题，默认不用"}
  arrival_date_month:       {availability: at_prediction, type: categorical}
  arrival_date_week_number: {availability: at_prediction, type: numeric}
  arrival_date_day_of_month: {availability: at_prediction, type: numeric}
  stays_in_weekend_nights:  {availability: at_prediction, type: numeric, note: "对已入住的订单，可能反映实际入住晚数而非预订晚数；列入审查"}
  stays_in_week_nights:     {availability: at_prediction, type: numeric, note: "同上"}
  adults:                   {availability: at_prediction, type: numeric}
  children:                 {availability: at_prediction, type: numeric, note: "有少量缺失"}
  babies:                   {availability: at_prediction, type: numeric}
  meal:                     {availability: at_prediction, type: categorical, note: "Undefined 与 SC 含义相同，合并"}
  country:                  {availability: unknown, type: categorical, compliance: review,
                             note: "社区中广为讨论：国籍可能在入住时才确认，被取消订单的取值可能有偏向性默认值；同时属于国籍信息。默认隔离"}
  market_segment:           {availability: at_prediction, type: categorical}
  distribution_channel:     {availability: at_prediction, type: categorical}
  is_repeated_guest:        {availability: history, type: binary}
  previous_cancellations:   {availability: history, type: numeric}
  previous_bookings_not_canceled: {availability: history, type: numeric}
  reserved_room_type:       {availability: at_prediction, type: categorical}
  assigned_room_type:       {availability: before_outcome, type: categorical,
                             note: "入住时分配；与 reserved_room_type 不一致几乎只出现在已入住的订单中"}
  booking_changes:          {availability: updated_until_event, type: numeric, note: "累计到入住或取消为止"}
  deposit_type:             {availability: at_prediction, type: categorical,
                             note: "数据中 Non Refund 的取消率反直觉地高（可能与团体/渠道订单有关）。critic 标注但不自动剔除"}
  agent:                    {availability: at_prediction, type: categorical, note: "ID，高基数，含 NULL 字符串"}
  company:                  {availability: at_prediction, type: categorical, note: "ID，高基数，大量 NULL"}
  days_in_waiting_list:     {availability: updated_until_event, type: numeric}
  customer_type:            {availability: at_prediction, type: categorical}
  adr:                      {availability: updated_until_event, type: numeric,
                             note: "平均每日房价；对已入住订单可能按实际消费计算。有负值和极端值"}
  required_car_parking_spaces: {availability: before_outcome, type: numeric,
                             note: "被取消的订单几乎全为 0，疑似入住时才登记"}
  total_of_special_requests: {availability: updated_until_event, type: numeric}
  reservation_status:       {availability: post_outcome, role: label_check_only}
  reservation_status_date:  {availability: post_outcome}

classic_derived:
  # 规则：派生特征的可得时间 = 其输入中最弱的可得时间（任一输入为 unknown，派生特征即为 unknown）
  - {name: total_nights, expr: "stays_in_weekend_nights + stays_in_week_nights", availability: at_prediction}
  - {name: total_guests, expr: "adults + coalesce(children, 0) + babies", availability: at_prediction}
  - {name: has_kids, expr: "coalesce(children, 0) + babies > 0", availability: at_prediction}
  - {name: weekend_share, expr: "stays_in_weekend_nights / nullif(total_nights, 0)", availability: at_prediction}
  - {name: cancel_history_ratio,
     expr: "previous_cancellations / nullif(previous_cancellations + previous_bookings_not_canceled, 0)",
     availability: history}
  - {name: booking_month, expr: "month(arrival_date - lead_time)", availability: at_prediction}
  - {name: price_per_guest, expr: "adr / nullif(total_guests, 0)", availability: unknown, note: "继承 adr 的可得时间"}
  - {name: room_mismatch, expr: "reserved_room_type <> assigned_room_type", availability: before_outcome,
     note: "典型的事后泄漏派生特征，用于泄漏检测评估"}
