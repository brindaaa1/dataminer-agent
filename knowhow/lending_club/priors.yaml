# 目标方向先验：+1 = 值越大越可能是正类；-1 = 越小越可能；0 = 无先验（不加单调约束）。
# 单调约束和模型卡读这里；模板产出的特征方向继承模板 / 领域手册里的 direction。没列出的特征不加约束。
# 新特征的方向可以由 LLM 提议，但要写出业务理由，并经过「加约束 vs 不加约束」的比较才保留。
target_direction:
  fico_range_low: -1
  fico_range_high: -1
  annual_inc: -1
  credit_history_months: -1        # 派生：issue_d - earliest_cr_line
  total_acc: 0                     # 账户多既可能代表信用深度，也可能代表多头，不加约束
  dti: +1
  revol_util: +1
  inq_last_6mths: +1
  delinq_2yrs: +1
  pub_rec: +1
  pub_rec_bankruptcies: +1
  loan_amnt: +1
  loan_to_income: +1               # 派生：loan_amnt / annual_inc
  mths_since_last_delinq: 0        # 缺失 = 从未逾期（风险最低），数值上又是越大越好，非单调，不加约束
  int_rate: +1                     # 仅在 A7 中使用
