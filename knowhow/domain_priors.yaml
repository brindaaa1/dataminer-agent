# 领域先验：风险方向、业务合理性规则、泄漏气味规则
# 使用者：
#   - 单调约束（modeling/zoo.py）：risk_direction
#   - critic 与报告：sanity_rules
#   - guardrail（LEAK_SUSPECT）：leakage_smells
#
# risk_direction：+1 = 值越大风险越高（违约概率越高）；-1 = 值越大风险越低；0 = 无先验。
# 注意：LightGBM 的 monotone_constraints 作用于模型输出。如果模型输出的是违约概率，
# 约束方向直接等于 risk_direction。

risk_direction:
  lending_club:
    fico_range_low: -1
    fico_range_high: -1
    annual_inc: -1
    credit_history_months: -1        # 派生：issue_d - earliest_cr_line
    total_acc: 0                     # 账户多既可能代表信用深度，也可能代表多头，不加约束
    dti: +1
    revol_util: +1
    inq_last_6mths: +1
    delinq_2yrs: +1
    pub_rec: +1
    pub_rec_bankruptcies: +1
    loan_amnt: +1
    loan_to_income: +1               # 派生：loan_amnt / annual_inc
    mths_since_last_delinq: 0        # 缺失 = 从未逾期（风险最低），数值上又是越大越好，非单调，不加约束
    int_rate: +1                     # 仅在 A7 中使用

  home_credit:
    EXT_SOURCE_1: -1
    EXT_SOURCE_2: -1
    EXT_SOURCE_3: -1
    AMT_INCOME_TOTAL: -1
    credit_income_ratio: +1
    annuity_income_ratio: +1
    # 模板产出的特征：方向继承 templates/*.yaml 中的 monotone_prior；
    # 单个 agg 上标注了自己的 monotone_prior 时以 agg 为准。

  hotel_bookings:
    # "风险" = 取消概率
    lead_time: +1
    previous_cancellations: +1
    cancel_history_ratio: +1
    previous_bookings_not_canceled: -1
    is_repeated_guest: -1
    total_nights: 0                  # 方向不明，不加约束
    # deposit_type 等类别变量不加单调约束

  default_policy: >
    没有列在这里、也没有从模板继承到方向的特征，不加单调约束。
    LLM 可以为新特征提议风险方向，但必须写出业务理由；该约束需经过"加约束 vs 不加约束"的 compare 才能保留。

sanity_rules:
  # critic 和报告使用；违反时标注为"反直觉"，交人工判断（不自动剔除）。
  - "SHAP 方向与 risk_direction 相反的特征（比如收入越高风险越高）"
  - "单个特征的 SHAP 贡献占比超过 40%"
  - "特征的业务含义无法用一句话解释"
  - "与 label 定义字段同源（如 label 基于逾期，而特征直接是当前逾期状态）"
  - "模型在某个分月上的 AUC 比其他月份低 0.05 以上"

leakage_smells:
  # 与数据集无关的泄漏识别规则。命中任一条即标记 LEAK_SUSPECT。
  statistical:
    - "单特征 AUC > 0.75（阈值在 config.yaml 中可调）"
    - "特征只在正样本中非零或非缺失"
    - "特征的缺失模式与 label 强相关（缺失率在正负样本间相差 > 30 个百分点）"
  semantic:
    - "字段名包含：payment、pymnt、recover、collection、settlement、hardship、writeoff、charge_off、last_、next_、current_status"
    - "字段描述提到'贷后'、'催收'、'核销'、'当前'、'最新'"
    - "字段的 availability 为 post_origination 或 unknown"
  temporal:
    - "特征计算中使用了晚于 observation_time 的记录"
    - "特征在 OOT 分月上的 AUC 显著高于训练期（可能利用了随时间积累的贷后信息）"
