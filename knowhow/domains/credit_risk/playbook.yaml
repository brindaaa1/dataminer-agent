# 信贷风控领域手册（第一份填好的示例）。内容来自原 domain_priors.yaml 的泄漏气味、合理性规则和 templates/generic_credit.yaml 的特征概念。
# 字段说明见 domains/_template/playbook.yaml；没填的字段沿用 _default。
name: credit_risk
title: 信贷风控（违约预测）
description: 预测借款人在贷款期内是否违约或严重逾期。正类是违约 / 逾期；数据通常是申请时信息加征信、历史借贷、还款记录，多表、按时间切分。
match_keywords:
- 违约
- 逾期
- 贷款
- 借款
- 信用
- 授信
- 坏账
- 风控
- default
- loan
- credit
- delinquency
target:
  positive_meaning: 违约或严重逾期
  direction_note: +1 = 值越大越可能违约
metric:
  primary: auc
  guards:
    ks: 0.02
  report:
  - auc
  - ks
  - pr_auc
leakage_name_patterns:
- payment
- pymnt
- recover
- collection
- settlement
- hardship
- writeoff
- charge_off
leakage_desc_keywords:
- 贷后
- 催收
- 核销
sanity_rules:
- SHAP 方向与目标方向相反的特征（比如收入越高越可能违约）
feature_concepts:
- id: multi_lending
  concept: 多头借贷 / 资金紧张
  inputs:
  - credit_applications
  - credit_queries
  windows:
  - 7
  - 30
  - 90
  - 180
  - 365
  aggs:
  - count
  - count_distinct(lender)
  derived:
  - ratio(short/long)
  - trend(30 vs 180)
  - recency
  direction: 1
  rationale: 短期内频繁在多家机构申请或被查询，通常意味着资金紧张或在"以贷养贷"。
- id: application_outcome
  concept: 历史申请被拒
  inputs:
  - past_applications_with_status
  windows:
  - 90
  - 365
  - all
  aggs:
  - count_refused
  - refusal_rate
  derived:
  - recency(last_refused)
  direction: 1
  rationale: 被其他机构或本机构拒绝，是其他风控模型的负面信号。
- id: delinquency_history
  concept: 历史逾期
  inputs:
  - repayment_records
  - bureau_status
  windows:
  - 90
  - 180
  - 365
  - all
  aggs:
  - max_dpd
  - count_dpd_gt_0
  - count_dpd_gt_30
  - sum_overdue_amount
  derived:
  - recency(last_delinquency)
  - trend(180 vs all)
  direction: 1
  rationale: 过去逾期是未来逾期最强的预测因子；逾期越近、越严重，风险越高。
- id: repayment_behavior
  concept: 还款习惯
  inputs:
  - installment_due
  - installment_paid
  windows:
  - 90
  - 180
  - 365
  - all
  aggs:
  - mean_days_late
  - max_days_late
  - share_late
  - mean_pay_ratio
  - share_underpaid
  derived:
  - trend(recent vs all)
  direction: 1
  rationale: 习惯性晚还或少还，即使尚未构成逾期，也是还款意愿或能力下降的早期信号。
- id: utilization
  concept: 额度使用率
  inputs:
  - balance
  - credit_limit
  windows:
  - 1
  - 3
  - 6
  - 12
  aggs:
  - mean
  - max
  - last
  derived:
  - trend(3 vs 12)
  direction: 1
  rationale: 额度用满说明流动性紧张；使用率快速上升比绝对水平更有预警价值。
- id: debt_burden
  concept: 负债负担
  inputs:
  - outstanding_debt
  - income
  - installment_amount
  windows:
  - current
  aggs:
  - sum
  derived:
  - ratio(debt/income)
  - ratio(installment/income)
  direction: 1
  rationale: 负债收入比和月供收入比越高，偿债缓冲越小。
- id: credit_depth
  concept: 信用历史的深度与稳定性
  inputs:
  - account_open_dates
  - accounts
  windows:
  - all
  aggs:
  - age_of_oldest
  - count_accounts
  - count_closed_normally
  derived:
  - ratio(closed_normally/total)
  direction: -1
  rationale: 信用历史越长、正常结清的记录越多，对借款人的还款行为了解越充分。
- id: exposure_change
  concept: 负债规模的变化
  inputs:
  - credit_amounts_by_time
  windows:
  - 90
  - 365
  aggs:
  - sum_new_credit
  - count_new_accounts
  derived:
  - trend(90 vs 365)
  direction: 1
  rationale: 近期负债快速扩张通常先于违约。
- id: loan_request_profile
  concept: 本次申请相对自身能力的规模
  inputs:
  - requested_amount
  - income
  - goods_price
  windows:
  - current
  aggs:
  - value
  derived:
  - ratio(amount/income)
  - ratio(credit/goods_price)
  direction: 1
  rationale: 借款金额相对收入过高，或贷款金额超过商品价格（多借现金），风险更高。
