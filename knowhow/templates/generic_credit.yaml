# 通用风控特征模板（与数据集无关的抽象层）
# 用途：作为 FEATURE_GEN 的 prompt 上下文，告诉 LLM"风控里有哪些值得挖的信息维度"。
# 具体数据集上的实例化见 templates/<dataset>.yaml。
#
# 字段说明：
#   id             模板族 ID
#   concept        要刻画的风险概念
#   inputs         需要的抽象输入（实例化时映射到具体表和字段）
#   windows        建议的时间窗口（天或月，由实例化文件决定单位）
#   aggs           聚合方式
#   derived        派生方式：ratio(a/b) 比例；trend(a vs b) 短窗口相对长窗口的变化；recency 距今时间
#   monotone_prior 风险方向：+1 = 值越大风险越高；-1 = 值越大风险越低；0 = 无先验（不加单调约束）
#   rationale      业务逻辑（也用于 critic 审查和报告中的特征解释）

families:
  - id: multi_lending
    concept: 多头借贷 / 资金紧张
    inputs: [credit_applications, credit_queries]
    windows: [7, 30, 90, 180, 365]
    aggs: [count, count_distinct(lender)]
    derived: ["ratio(short/long)", "trend(30 vs 180)", recency]
    monotone_prior: +1
    rationale: 短期内频繁在多家机构申请或被查询，通常意味着资金紧张或在"以贷养贷"。

  - id: application_outcome
    concept: 历史申请被拒
    inputs: [past_applications_with_status]
    windows: [90, 365, all]
    aggs: [count_refused, refusal_rate]
    derived: ["recency(last_refused)"]
    monotone_prior: +1
    rationale: 被其他机构或本机构拒绝，是其他风控模型的负面信号。

  - id: delinquency_history
    concept: 历史逾期
    inputs: [repayment_records, bureau_status]
    windows: [90, 180, 365, all]
    aggs: [max_dpd, count_dpd_gt_0, count_dpd_gt_30, sum_overdue_amount]
    derived: ["recency(last_delinquency)", "trend(180 vs all)"]
    monotone_prior: +1
    rationale: 过去逾期是未来逾期最强的预测因子；逾期越近、越严重，风险越高。

  - id: repayment_behavior
    concept: 还款习惯
    inputs: [installment_due, installment_paid]
    windows: [90, 180, 365, all]
    aggs: [mean_days_late, max_days_late, share_late, mean_pay_ratio, share_underpaid]
    derived: ["trend(recent vs all)"]
    monotone_prior: +1          # pay_ratio 和 early_payment 类特征方向为 -1，实例化时单独标注
    rationale: 习惯性晚还或少还，即使尚未构成逾期，也是还款意愿或能力下降的早期信号。

  - id: utilization
    concept: 额度使用率
    inputs: [balance, credit_limit]
    windows: [1, 3, 6, 12]       # 月
    aggs: [mean, max, last]
    derived: ["trend(3 vs 12)"]
    monotone_prior: +1
    rationale: 额度用满说明流动性紧张；使用率快速上升比绝对水平更有预警价值。

  - id: debt_burden
    concept: 负债负担
    inputs: [outstanding_debt, income, installment_amount]
    windows: [current]
    aggs: [sum]
    derived: ["ratio(debt/income)", "ratio(installment/income)"]
    monotone_prior: +1
    rationale: 负债收入比和月供收入比越高，偿债缓冲越小。

  - id: credit_depth
    concept: 信用历史的深度与稳定性
    inputs: [account_open_dates, accounts]
    windows: [all]
    aggs: [age_of_oldest, count_accounts, count_closed_normally]
    derived: ["ratio(closed_normally/total)"]
    monotone_prior: -1
    rationale: 信用历史越长、正常结清的记录越多，对借款人的还款行为了解越充分。

  - id: exposure_change
    concept: 负债规模的变化
    inputs: [credit_amounts_by_time]
    windows: [90, 365]
    aggs: [sum_new_credit, count_new_accounts]
    derived: ["trend(90 vs 365)"]
    monotone_prior: +1
    rationale: 近期负债快速扩张通常先于违约。

  - id: loan_request_profile
    concept: 本次申请相对自身能力的规模
    inputs: [requested_amount, income, goods_price]
    windows: [current]
    aggs: [value]
    derived: ["ratio(amount/income)", "ratio(credit/goods_price)"]
    monotone_prior: +1
    rationale: 借款金额相对收入过高，或贷款金额超过商品价格（多借现金），风险更高。

# 给 LLM 的使用约束：
# 1. 优先组合现有模板族；提出新的派生方式时，必须写明 concept、monotone_prior 和 rationale。
# 2. 任何特征的输入字段必须能在数据字典中找到，且 availability 不能是 post_origination 或 unknown。
# 3. 探索性假设（"看起来不太靠谱"的）要打上 exploratory: true，只允许低保真运行。
